name: Build and Deploy Backend to Rahti

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repo code
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push backend image
              uses: docker/build-push-action@v5
              with:
                  context: ./backend
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/three-tier-backend:v6

            - name: Install OpenShift CLI
              uses: redhat-actions/openshift-cli-installer@v1
              with:
                  oc: "4.14"

            - name: Log in to CSC Rahti
              run: |
                  oc login ${{ secrets.RAHTI_SERVER }} --token=${{ secrets.RAHTI_TOKEN }} --insecure-skip-tls-verify=true

            - name: Trigger image update on Rahti
              run: |
                  oc set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/three-tier-backend:v6
